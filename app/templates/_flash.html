{% with msgs = get_flashed_messages(with_categories=true) %}
{% for cat, msg in msgs %}
<div class="mt-4 rounded-lg px-4 py-2.5 text-sm border {{ 'bg-emerald-50 border-emerald-200 text-emerald-800' if cat == 'ok' else 'bg-red-50 border-red-200 text-red-800' }}">{{ msg }}</div>
{% endfor %}
{% endwith %}
